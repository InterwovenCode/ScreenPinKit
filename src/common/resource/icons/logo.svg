<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Digital image design icon</title>
  <desc id="desc">A framed landscape behind a desktop design interface, with a blue drawing gesture and stylus.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0788ff"/><stop offset="1" stop-color="#075cf2"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08c57f"/><stop offset="1" stop-color="#00a95c"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd21a"/><stop offset="1" stop-color="#ffad00"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27394c"/><stop offset="1" stop-color="#172433"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfd3f5"/><stop offset="1" stop-color="#9db8e4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17304f" flood-opacity=".22"/></filter>
  </defs>

  <g id="image-card" filter="url(#shadow)">
    <rect id="frame-outline" pathLength="1" x="83" y="139" width="713" height="650" rx="107" fill="url(#paper)" stroke="#fff" stroke-width="25"/>
    <rect x="112" y="161" width="658" height="594" rx="79" fill="none" stroke="url(#blue)" stroke-width="54"/>
    <g id="landscape">
      <circle id="sun" cx="514" cy="306" r="65" fill="url(#yellow)"/>
      <path d="M173 497c0-14 5-26 14-36l112-120c20-21 55-21 75 1l127 151 58-65c20-22 55-22 76 0l69 70H173z" fill="url(#green)"/>
      <path d="M173 497h531v122H199c-15 0-26-12-26-27z" fill="url(#green)"/>
    </g>
  </g>

  <g id="monitor" filter="url(#shadow)">
    <path id="monitor-outline" pathLength="1" d="M468 505h610c45 0 81 36 81 81v401c0 45-36 81-81 81H858v54h70c19 0 34 15 34 34s-15 34-34 34H589c-19 0-34-15-34-34s15-34 34-34h68c12 0 20-9 20-20v-34H468c-45 0-81-36-81-81V586c0-45 36-81 81-81z" fill="url(#ink)" stroke="#fff" stroke-width="16"/>
    <rect id="screen-outline" pathLength="1" x="443" y="550" width="661" height="468" rx="32" fill="url(#paper)" stroke="#fff" stroke-width="10"/>
    <g id="ui-details">
      <path d="M469 570h609a16 16 0 0 1 16 16v68H469z" fill="url(#blue)"/>
      <circle cx="516" cy="613" r="17" fill="#ff6669"/><circle cx="571" cy="613" r="17" fill="#ffc814"/><circle cx="626" cy="613" r="17" fill="#08cf88"/>
      <rect x="493" y="899" width="319" height="27" rx="14" fill="url(#soft)"/>
      <rect x="493" y="947" width="243" height="27" rx="14" fill="url(#soft)"/>
      <rect x="875" y="770" width="209" height="183" rx="22" fill="url(#soft)"/>
    </g>
  </g>

  <g id="gesture">
    <path id="gesture-path" pathLength="1" d="M219 921C396 846 519 704 656 703c85-1 37 60-20 100-55 40-18 63 32 54 69-13 122-53 157-104" fill="none" stroke="url(#blue)" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="stylus" filter="url(#shadow)">
    <g id="pen-clip">
      <path id="clip-outline" pathLength="1" d="M1158 345l18 11c17 11 19 27 9 43l-52 72" fill="none" stroke="#fff" stroke-width="49" stroke-linecap="round"/>
      <path d="M1158 345l18 11c17 11 19 27 9 43l-52 72" fill="none" stroke="url(#blue)" stroke-width="28" stroke-linecap="round"/>
    </g>
    <path id="pen-body" pathLength="1" d="M878 573L1083 269C1099 245 1126 237 1149 252C1174 268 1183 293 1166 319L972 634C936 623 902 601 878 573Z" fill="url(#ink)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
    <path id="pen-collar" pathLength="1" d="M878 573C902 601 936 623 972 634L949 665C914 655 882 636 858 609Z" fill="url(#ink)" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
    <path id="pen-tip" pathLength="1" d="M858 609C882 636 914 655 949 665C919 695 881 723 858 734C842 741 830 733 829 717C827 687 839 642 858 609Z" fill="url(#blue)" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
